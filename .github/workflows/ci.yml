name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MUVE_IGNORAR_ARQUIVO_ENV: "true"
      EXPO_NO_DOTENV: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Instalação pelos lockfiles
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Testes
        run: pnpm test
      - name: Exportação do bundle Android
        working-directory: Mobile
        run: npx expo export --platform android --output-dir "${{ runner.temp }}/expo-export"
